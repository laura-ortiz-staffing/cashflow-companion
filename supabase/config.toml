project_id = "shuubonsatzqnhiazrdv"

[auth]
site_url = "https://cashflow-companion.onrender.com"
additional_redirect_urls = ["https://cashflow-companion.onrender.com/*", "https://cashflow-companion.onrender.com/reset-password"]

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.email.template.recovery]
subject = "Reset your Petty Cash password"
content_path = "./supabase/templates/recovery.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.send-report]
verify_jwt = true

[functions.extract-invoice]
verify_jwt = true

[functions.qa-chat]
verify_jwt = true

[functions.graph-bootstrap]
verify_jwt = true

[functions.graph-push]
verify_jwt = true

# graph-pull receives notifications from Microsoft Graph itself, which cannot
# present a Supabase JWT. Authentication is performed inside the function by
# matching the clientState against graph_sync_state.client_state.
[functions.graph-pull]
verify_jwt = false

[functions.twilio-bot]
verify_jwt = false

[functions.app-bot]
verify_jwt = true
